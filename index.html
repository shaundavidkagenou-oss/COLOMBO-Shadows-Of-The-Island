<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COLOMBO: Shadows of the Island — Shaun David Studios</title>
  <meta name="description" content="A third-person open-world adventure set in Colombo, Sri Lanka. A Shaun David Studios production." />
  <link rel="icon" href="./assets/brand/sds-logo.jpg" />
  <!-- Entry gate: plain HTML/CSS so it is on screen the instant the page opens, before the game bundle has loaded.
       The click is the browser's required user gesture for audio; the game (src/ui/Screens.js) waits for it and then
       plays the Shaun David Studios loading sequence. -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #gate { position: fixed; inset: 0; z-index: 200; background: radial-gradient(120% 90% at 50% 110%, #1a1208 0%, #07080b 45%, #000 100%); color: #f4efe6; display: grid; place-items: center; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; transition: opacity .7s ease, filter .7s ease; user-select: none; }
    #gate.gone { opacity: 0; filter: blur(6px) brightness(2); pointer-events: none; }
    #gate .g-fog { position: absolute; inset: -20%; background: radial-gradient(40% 25% at 30% 70%, rgba(120,110,95,.16), transparent 70%), radial-gradient(45% 30% at 75% 60%, rgba(90,100,110,.14), transparent 70%); animation: gfog 26s ease-in-out infinite alternate; will-change: transform; }
    @keyframes gfog { from { transform: translate3d(-4%, 0, 0) scale(1); } to { transform: translate3d(4%, -2%, 0) scale(1.08); } }
    #gate .g-rain { position: absolute; inset: -10% 0 0 0; opacity: .22; background: repeating-linear-gradient(103deg, transparent 0 22px, rgba(200,215,230,.22) 22px 23px, transparent 23px 61px); background-size: 180px 260px; animation: grain .55s linear infinite; will-change: transform; }
    @keyframes grain { from { transform: translate3d(0, -260px, 0); } to { transform: translate3d(-57px, 0, 0); } }
    #gate .g-flash { position: absolute; inset: 0; background: radial-gradient(70% 60% at 62% 10%, rgba(210,225,255,.55), transparent 70%); opacity: 0; animation: gflash 9s infinite; }
    @keyframes gflash { 0%, 71%, 74.5%, 76%, 100% { opacity: 0; } 72% { opacity: .9; } 73% { opacity: .15; } 75% { opacity: .6; } }
    #gate .g-sky { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 46vh; }
    #gate .g-sky .far { fill: #0d0f13; } #gate .g-sky .near { fill: #050608; }
    #gate .g-sky .lamp { fill: #ffb347; animation: glamp 3.2s ease-in-out infinite alternate; } #gate .g-sky .lotus { fill: #3a1838; } #gate .g-sky .lotusg { fill: #b04ba0; animation: glamp 4s ease-in-out infinite alternate; }
    @keyframes glamp { from { opacity: .35; } to { opacity: 1; } }
    #gate .g-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.85) 100%); pointer-events: none; }
    #gate .g-box { position: relative; text-align: center; margin-top: -12vh; animation: grise 1.6s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes grise { from { opacity: 0; transform: translateY(22px) scale(.98); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
    #gate .g-native { font-family: 'Noto Sans Sinhala', 'Noto Sans Tamil', sans-serif; font-size: clamp(14px, 1.8vw, 20px); color: rgba(232,163,58,.75); margin-bottom: .6em; }
    #gate .g-title { position: relative; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: clamp(54px, 11vw, 168px); line-height: .9; letter-spacing: .14em; padding-left: .14em; background: linear-gradient(180deg, #fff9ee 0%, #e9d3ab 46%, #9a7444 54%, #f1d9a6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 30px rgba(232,163,58,.25)); }
    #gate .g-title::after { content: 'COLOMBO'; position: absolute; inset: 0; padding-left: .14em; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.95) 50%, transparent 60%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gglint 5.5s ease-in-out 1.2s infinite; }
    @keyframes gglint { 0% { background-position: 130% 0; } 35%, 100% { background-position: -130% 0; } }
    #gate .g-sub { display: flex; align-items: center; justify-content: center; gap: 1.1em; margin-top: .55em; font-weight: 600; font-size: clamp(13px, 1.9vw, 24px); letter-spacing: .55em; padding-left: .55em; color: #e8a33a; }
    #gate .g-sub i { display: block; width: clamp(30px, 8vw, 110px); height: 1px; background: linear-gradient(90deg, transparent, #e8a33a); } #gate .g-sub i:last-child { transform: scaleX(-1); }
    #gate .g-btn { position: relative; margin-top: 7vh; padding: 1.05em 3.6em; font: 700 clamp(16px, 1.7vw, 22px) 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: .42em; text-indent: .42em; color: #fff3dc; background: rgba(20,14,6,.55); border: 0; cursor: pointer; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%); transition: color .25s, transform .25s; outline: none; }
    #gate .g-btn::before { content: ''; position: absolute; inset: 0; padding: 1.5px; background: linear-gradient(90deg, #8a5a1c, #ffcf7a, #8a5a1c); clip-path: inherit; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
    #gate .g-btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #e8a33a, #ffcf7a); transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.6,0,.2,1); z-index: -1; }
    #gate .g-btn span { position: relative; z-index: 1; }
    #gate .g-btn:hover { color: #120c04; transform: scale(1.04); } #gate .g-btn:hover::after { transform: scaleX(1); } #gate .g-btn:focus { outline: none; } #gate .g-btn:focus-visible { box-shadow: 0 0 0 1px rgba(255,214,150,.55), 0 0 28px rgba(232,163,58,.35); }
    #gate .g-btn .shine { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,240,210,.35) 50%, transparent 65%); transform: translateX(-120%); animation: gshine 3.4s ease-in-out 2s infinite; }
    @keyframes gshine { 0% { transform: translateX(-120%); } 40%, 100% { transform: translateX(120%); } }
    #gate .g-ring { position: absolute; left: 50%; top: 50%; width: 100%; height: 100%; transform: translate(-50%, -50%); pointer-events: none; }
    #gate .g-ring::before { content: ''; position: absolute; inset: -10px -26px; border: 1px solid rgba(232,163,58,.5); clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 20px 100%, 0 50%); animation: gring 2.4s ease-out infinite; }
    @keyframes gring { from { opacity: .9; transform: scale(.94); } to { opacity: 0; transform: scale(1.12); } }
    #gate.entering .g-btn { color: #120c04; } #gate.entering .g-btn::after { transform: scaleX(1); }
    #gate .g-hint { margin-top: 2.2vh; font-size: 13px; letter-spacing: .28em; color: rgba(244,239,230,.42); text-transform: uppercase; }
    #gate .g-foot { position: absolute; left: 0; right: 0; bottom: 3.2vh; display: flex; justify-content: space-between; padding: 0 4vw; font-size: 12px; letter-spacing: .3em; color: rgba(244,239,230,.4); text-transform: uppercase; }
    #gate .g-foot b { color: rgba(232,163,58,.8); font-weight: 600; }
    #gate .g-bar { position: absolute; left: 0; right: 0; height: 7vh; background: #000; } #gate .g-bar.t { top: 0; } #gate .g-bar.b { bottom: 0; }
  </style>
</head>
<body>
  <div id="gate">
    <div class="g-fog"></div>
    <svg class="g-sky" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <!-- original silhouette: Colombo skyline — towers, the Lotus Tower, the Fort clock-tower lighthouse, palms -->
      <path class="far" d="M0 420V300h60v-40h40v60h50V230h70v90h30v-60h55v-90h60v150h40V200h45v40h35v-80h70v160h30V260h55v-20h40v80h45V170h20v-30h60v30h20v150h40V250h60v70h50V190h80v130h40v-60h55v60h40V230h70v90h50V280h60v140z"/>
      <rect class="lotus" x="1118" y="96" width="14" height="230"/>
      <path class="lotus" d="M1125 30c-26 18-34 46-28 66h56c6-20-2-48-28-66z"/>
      <rect class="lotusg" x="1123" y="6" width="4" height="26"/>
      <path class="lotusg" d="M1125 40c-14 12-19 30-16 50h32c3-20-2-38-16-50z" opacity=".55"/>
      <path class="near" d="M0 420V352h90v-30h26v30h64v-46h48v46h40v-70h12l8-22 8 22h12v70h60v-34h80v34h44V318h30v-24h22v24h30v102h60v-60h70v-38h20v38h70v60h40V330h90v90h36v-56h64v56h50V340h40v-24h16v24h44v80h70v-48h52v48h60V350h90v70z"/>
      <rect class="near" x="254" y="250" width="12" height="40"/><path class="near" d="M248 252h24l-12-18z"/>
      <circle class="lamp" cx="260" cy="244" r="3"/>
      <path class="near" d="M1478 420c4-60 8-110 2-170M1480 250c-30-6-46 6-58 18 18-6 38-8 58-14 16 4 36 10 54 22-12-14-30-28-54-26M1480 250c-6-22-22-32-40-34 14 8 26 20 40 34 10-14 24-26 44-30-18-2-34 10-44 30z" stroke="#050608" stroke-width="5" fill="none"/>
      <path class="near" d="M120 420c3-50 6-90 0-140M120 280c-24-4-36 6-46 16 14-4 30-6 46-12 14 4 28 8 42 18-10-12-24-22-42-22" stroke="#050608" stroke-width="4" fill="none"/>
      <g class="lamp"><rect x="402" y="330" width="3" height="3"/><rect x="760" y="316" width="3" height="3"/><rect x="884" y="290" width="3" height="4"/><rect x="1012" y="300" width="3" height="3"/><rect x="1310" y="300" width="3" height="3"/><rect x="560" y="276" width="3" height="3"/></g>
    </svg>
    <div class="g-rain"></div><div class="g-flash"></div><div class="g-vig"></div>
    <div class="g-bar t"></div><div class="g-bar b"></div>
    <div class="g-box">
      <div class="g-native">කොළඹ &nbsp;·&nbsp; கொழும்பு</div>
      <div class="g-title">COLOMBO</div>
      <div class="g-sub"><i></i>SHADOWS OF THE ISLAND<i></i></div>
      <button class="g-btn" id="gate-enter" type="button"><span class="g-ring"></span><span class="shine"></span><span>ENTER GAME</span></button>
      <div class="g-hint">Headphones recommended</div>
    </div>
    <div class="g-foot"><span>A <b>Shaun David Studios</b> production</span><span>Keyboard &amp; mouse · Gamepad</span></div>
  </div>
  <script>
    // the game module may still be loading when the button is pressed: remember the click and let Screens pick it up
    (function () {
      var g = document.getElementById('gate'), b = document.getElementById('gate-enter');
      if (/[?&]test\b/.test(location.search) && /[?&]quick=/.test(location.search)) { g.remove(); return; } // automated test runs skip the gate
      function go() { if (window.__sdsEntered) return; window.__sdsEntered = true; g.classList.add('entering'); window.dispatchEvent(new Event('sds-enter')); }
      b.addEventListener('click', go); addEventListener('keydown', function (e) { if (e.code === 'Enter' || e.code === 'Space') go(); });
      setTimeout(function () { b.focus({ preventScroll: true }); }, 400);
    })();
  </script>
  <div id="app"></div>
  <noscript>COLOMBO: Shadows of the Island needs JavaScript and WebGL 2.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
