<!doctype html><html><body style="margin:0;background:#888"><canvas id="c"></canvas>
<script type="module">
// Dev check of the sitting pose: an adult occupant in EVERY seat of a vehicle (?only=<type>, ?cut=1 hides the body shell
// and glass so the occupants can be seen against seats / dash / wheel, ?cam=x,y,z camera, ?h=<height m> occupant height)
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { buildTextures } from '/src/gfx/Textures.js';
import { buildMaterials } from '/src/gfx/Materials.js';
import { createVehicleMesh, VTYPES } from '/src/vehicles/VehicleModels.js';
import { Character, randomSpec } from '/src/actors/Character.js';
import { seatCharacter } from '/src/actors/Seating.js';
await buildTextures('medium'); buildMaterials();
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); r.setSize(+(q.get('w') || 1200), +(q.get('hh') || 700)); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const s = new THREE.Scene(); s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; s.environmentIntensity = 0.6; s.background = new THREE.Color(0x9fb4c8);
s.add(new THREE.HemisphereLight(0xdde8ff, 0x665544, 1.4)); const d = new THREE.DirectionalLight(0xfff0dd, 2.5); d.position.set(5, 8, 6); s.add(d);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshStandardMaterial({ color: 0x555555 })); ground.rotation.x = -Math.PI / 2; s.add(ground);
const t = q.get('only') || 'tora'; const m = createVehicleMesh(t, +(q.get('seed') || 1)); s.add(m); m.rotation.y = +(q.get('ry') || 0);
const det = m.getObjectByName('detail'); if (det) det.visible = true;
const H = +(q.get('h') || 0); const chars = [];
const only = q.get('seats') ? q.get('seats').split(',').map(Number) : null;
m.userData.seats.forEach((seat, i) => { if (only && !only.includes(i)) return; const sp = randomSpec(1000 + i * 37, H ? {} : {}); if (H) { sp.height = H; sp.build = H > 1.8 ? 1.08 : 1; } const ch = new Character(sp); seatCharacter(ch, { mesh: m }, seat); chars.push(ch); });
for (let k = 0; k < 40; k++) for (const ch of chars) ch.anim.update(0.05, 0);
if (q.get('cut')) { const y = Math.min(...m.userData.seats.map((z) => z.roof)) - 0.02; r.clippingPlanes = [new THREE.Plane(new THREE.Vector3(0, -1, 0), y)]; if (q.get('xcut')) r.clippingPlanes.push(new THREE.Plane(new THREE.Vector3(1, 0, 0), +q.get('xcut'))); } // section cut just under the roof lining
const cam = new THREE.PerspectiveCamera(32, r.domElement.width / r.domElement.height, 0.1, 200); const cp = (q.get('cam') || '5.5,3.2,4').split(',').map(Number); cam.position.set(...cp); if (q.get('top')) cam.up.set(0, 0, 1); cam.lookAt(+(q.get('lx') || 0), +(q.get('ly') || 0.8), +(q.get('lz') || 0));
r.render(s, cam); window.done = true;
</script></body></html>
