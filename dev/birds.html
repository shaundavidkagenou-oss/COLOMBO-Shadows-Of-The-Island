<!doctype html><html><body style="margin:0;background:#888"><canvas id="c"></canvas>
<script type="module">
// Dev close-up of the three bird species in several poses. ?sp=crow|pigeon|parakeet (default all), ?cam=x,y,z&look=x,y,z, ?w=&h=
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { birdParts, PART_NAMES, triangleCount } from '/src/world/BirdModels.js';
import { poseBird, restPose, flapPose } from '/src/world/Birds.js';
const q = new URLSearchParams(location.search); const W = +(q.get('w') || 1400), H = +(q.get('h') || 800);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.shadowMap.enabled = true;
const s = new THREE.Scene(); s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; s.environmentIntensity = 0.55; s.background = new THREE.Color(0xa9bccd);
s.add(new THREE.HemisphereLight(0xe4eeff, 0x6b5a45, 1.1)); const d = new THREE.DirectionalLight(0xfff1dc, 2.6); d.position.set(1.5, 3, 2); d.castShadow = true; d.shadow.mapSize.set(2048, 2048); Object.assign(d.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 0.1, far: 10 }); d.shadow.bias = -0.0004; s.add(d);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x8a8378, roughness: 0.95 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; s.add(ground);
const sps = (q.get('sp') || 'crow,pigeon,parakeet').split(','); const poses = (q.get('poses') || 'rest,spread,down,glide,land').split(',');
const mats = Array.from({ length: 11 }, () => new THREE.Matrix4()); const info = [];
sps.forEach((sp, row) => {
  const P = birdParts(sp); const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: sp === 'crow' ? 0.42 : 0.6, side: THREE.DoubleSide, envMapIntensity: sp === 'crow' ? 1.3 : 0.8 });
  info.push(`${sp}: ${triangleCount(sp)} tris`);
  poses.forEach((pn, col) => {
    const p = restPose(sp); p.x = (col - (poses.length - 1) / 2) * 0.55; p.z = (row - (sps.length - 1) / 2) * -0.55; p.yaw = +(q.get('yaw') || 0.9);
    if (!['rest', 'walk', 'peck'].includes(pn)) { p.spread = 1; p.tuck = 1; p.y = 0.3; p.pitch = 0; Object.assign(p, pn === 'spread' ? flapPose(sp, 0.0, 1) : pn === 'down' ? flapPose(sp, 0.35, 1) : pn === 'glide' ? { flap: 0.1, flapOut: 0.05, sweep: 0.08, sweepOut: 0.12 } : { ...flapPose(sp, 0.7, 0.8), sweep: -0.25 }); if (pn === 'land') { p.pitch = -0.7; p.tuck = 0; p.tailFan = 1.7; p.tailPitch = -0.35; } else p.tailFan = 1.25; }
    if (pn === 'walk') { p.legL = 0.4; p.legR = -0.4; } if (pn === 'peck') { p.headPitch = 1.3; p.pitch += 0.3; p.headFwd = 0.012; }
    poseBird(sp, p, mats);
    PART_NAMES.forEach((n, k) => { const m = new THREE.Mesh(P[n], mat); m.matrixAutoUpdate = false; m.matrix.copy(mats[k]); m.castShadow = true; s.add(m); });
  });
});
const cam = new THREE.PerspectiveCamera(30, W / H, 0.01, 50); const cp = (q.get('cam') || '0,1.1,2.6').split(',').map(Number); cam.position.set(...cp); const lk = (q.get('look') || '0,0.12,0').split(',').map(Number); cam.lookAt(...lk);
r.render(s, cam); document.title = 'ready ' + info.join(' · '); window.__ready = true;
</script></body></html>
