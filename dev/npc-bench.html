<!doctype html><html><body style="margin:0;background:#888"><canvas id="c"></canvas>
<script type="module">
// NPC render-cost micro-benchmark (dev only). 40 full-body crowd NPCs with a shadow-casting sun, timed render + gl.finish.
// ?n=40 &cd=14 (camera distance, m) &frames=30 &w=960 &h=540. The result is printed with console.error (so headless
// runners that only capture errors still see it) and stored on window.result.
import * as THREE from 'three';
import { buildTextures } from '/src/gfx/Textures.js';
import { Character } from '/src/actors/Character.js';
import { makeAppearance } from '/src/actors/Appearance.js';
const q = new URLSearchParams(location.search); const N = +(q.get('n') || 40), cd = +(q.get('cd') || 14), F = +(q.get('frames') || 30);
const W = +(q.get('w') || 960), H = +(q.get('h') || 540);
buildTextures && buildTextures();
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false }); r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const s = new THREE.Scene(); s.background = new THREE.Color(0x9fb4c8); s.add(new THREE.HemisphereLight(0xdde8ff, 0x665544, 1.3));
const d = new THREE.DirectionalLight(0xfff0dd, 2.4); d.position.set(6, 12, 8); d.castShadow = true; d.shadow.mapSize.set(2048, 2048);
Object.assign(d.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 }); s.add(d);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x8d8a83, roughness: 0.95 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; s.add(ground);
let tb = performance.now(); const chars = [];
for (let i = 0; i < N; i++) { const ch = new Character(makeAppearance(4000 + i * 17)); ch.root.position.set((i % 10 - 4.5) * 1.3, 0, -Math.floor(i / 10) * 1.6); ch.root.rotation.y = 0.3; ch.mesh.castShadow = true; s.add(ch.root); chars.push(ch); }
const buildMs = (performance.now() - tb) / N;
// isolation switches: &heads=0 hides the crowd heads, &hs=0 keeps them out of the shadow pass, &lod=0|1 forces a level
s.traverse((o) => { if (o.name === 'npcHeadLOD') { if (q.get('heads') === '0') o.visible = false; if (q.has('lod')) { o.autoUpdate = false; o.levels.forEach((l, i) => { l.object.visible = i === +q.get('lod'); }); } }
  if ((o.name === 'npcHead' || o.name === 'npcHeadLo') && q.get('nomorph')) { const g = o.geometry.clone(); g.morphAttributes = {}; o.geometry = g; o.updateMorphTargets(); }
  if ((o.name === 'npcHead' || o.name === 'npcHeadLo') && q.get('onemat')) { window.__m ??= o.material; o.material = window.__m; }
  if ((o.name === 'npcHead' || o.name === 'npcHeadLo') && q.get('hs') === '0') Object.defineProperty(o, 'castShadow', { get: () => false, set() {}, configurable: true }); });
const cam = new THREE.PerspectiveCamera(50, W / H, 0.1, 200); cam.position.set(0, 1.7, cd); cam.lookAt(0, 1.2, -2);
const gl = r.getContext();
for (let i = 0; i < 4; i++) { for (const ch of chars) ch.anim.update(1 / 30, 1.2); r.render(s, cam); } gl.finish();
r.info.autoReset = false; const ft = [], at = [];
for (let i = 0; i < F; i++) { let t = performance.now(); for (const ch of chars) ch.anim.update(1 / 30, 1.2); at.push(performance.now() - t); r.info.reset(); t = performance.now(); r.render(s, cam); gl.finish(); ft.push(performance.now() - t); await new Promise((res) => setTimeout(res, 0)); }
const med = (a) => { a = a.slice().sort((x, y) => x - y); return +a[Math.floor(a.length / 2)].toFixed(2); };
let tris = 0, verts = 0; s.traverse((o) => { if (o.isMesh && o !== ground) { const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; verts += g.attributes.position.count; } });
window.result = { n: N, buildMsPerNpc: +buildMs.toFixed(2), renderMed: med(ft), animMed: med(at), calls: r.info.render.calls, frameTris: r.info.render.triangles, sceneTris: Math.round(tris), sceneVerts: verts, programs: r.info.programs.length };
console.error('RESULT ' + JSON.stringify(window.result)); window.__ready = true;
</script></body></html>
